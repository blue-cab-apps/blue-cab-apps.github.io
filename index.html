<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Blue Cab</title>
<style>
  :root { --bg: #ffffff; --text: #1c1c1e; --muted: #5c5c63; --link: #0a64d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111113; --text: #ececf0; --muted: #a4a4ad; --link: #6cb2ff; }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; padding: 2.5rem 1rem 4rem; }
  h1 { font-size: 1.9rem; line-height: 1.2; margin: 0 0 1.2rem; letter-spacing: -.01em; }
  h2 { font-size: 1.3rem; margin: 2rem 0 .4rem; }
  p { margin: 0 0 1rem; }
  a { color: var(--link); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Blue Cab</h1>
  <p class="muted">Small, private apps for iPhone.</p>
  <h2>Net Worth</h2>
  <p>Keep track of what you own, what you owe, and your net worth over time.</p>
  <p><a href="net-worth/support.html">Support</a> · <a href="net-worth/privacy-policy.html">Privacy Policy</a></p>
</main>
</body>
</html>
